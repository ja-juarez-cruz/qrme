name: Deploy Prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0

jobs:
  # ── PR: plan de infra como comentario ────────────────────────────────────
  plan:
    name: Terraform Plan (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      # ── Backend Tests ────────────────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: lambdas
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: lambdas
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      # ── AWS + Infraestructura ────────────────────────────────────────────

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Bootstrap backend S3 + DynamoDB (idempotente)
        run: |
          aws s3api head-bucket --bucket qrme-tfstate-prod 2>/dev/null || {
            aws s3api create-bucket --bucket qrme-tfstate-prod --region us-east-1
            aws s3api put-bucket-versioning --bucket qrme-tfstate-prod \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket qrme-tfstate-prod \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket qrme-tfstate-prod \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          }
          aws dynamodb describe-table --table-name qrme-tfstate-locks-prod --region us-east-1 2>/dev/null || \
            aws dynamodb create-table \
              --table-name qrme-tfstate-locks-prod \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backends/prod.hcl -reconfigure

      - name: Terraform Plan
        id: plan
        working-directory: infra
        run: |
          touch plan_output.txt
          terraform plan -var-file=envs/prod.tfvars -no-color 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comentar plan en PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('infra/plan_output.txt')
              ? fs.readFileSync('infra/plan_output.txt', 'utf8')
              : '(sin salida — el step de plan no llegó a ejecutarse)';
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncado)'
              : plan;
            const icon = '${{ steps.plan.outputs.exit_code }}' === '0' ? 'OK' : 'ERROR';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '[' + icon + '] Terraform Plan -- QRME Produccion\n\`\`\`hcl\n' + truncated + '\n\`\`\`'
            });

      - name: Fail si el plan tuvo error
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1

  # ── Push a main: tests + infra + frontend ───────────────────────────────
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      # ── Backend Tests ────────────────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: lambdas
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: lambdas
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      # ── AWS + Infraestructura ────────────────────────────────────────────

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Bootstrap backend S3 + DynamoDB (idempotente)
        run: |
          aws s3api head-bucket --bucket qrme-tfstate-prod 2>/dev/null || {
            aws s3api create-bucket --bucket qrme-tfstate-prod --region us-east-1
            aws s3api put-bucket-versioning --bucket qrme-tfstate-prod \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket qrme-tfstate-prod \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket qrme-tfstate-prod \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          }
          aws dynamodb describe-table --table-name qrme-tfstate-locks-prod --region us-east-1 2>/dev/null || \
            aws dynamodb create-table \
              --table-name qrme-tfstate-locks-prod \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backends/prod.hcl -reconfigure

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=envs/prod.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      # ── Frontend ────────────────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qrme-frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: qrme-frontend
        run: npm ci

      - name: Obtener outputs de Terraform
        id: tf_outputs
        working-directory: infra
        run: |
          echo "api_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
          echo "cognito_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(terraform output -raw cognito_domain)" >> $GITHUB_OUTPUT
          echo "cf_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "web_bucket=$(terraform output -raw web_bucket_name)" >> $GITHUB_OUTPUT

      - name: Build frontend (prod)
        working-directory: qrme-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.tf_outputs.outputs.api_url }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ steps.tf_outputs.outputs.cognito_pool_id }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf_outputs.outputs.cognito_client_id }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.tf_outputs.outputs.cognito_domain }}
        run: npm run build

      - name: Sync a S3
        run: aws s3 sync qrme-frontend/out/ s3://${{ steps.tf_outputs.outputs.web_bucket }} --delete

      - name: Invalidar cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cf_distribution_id }} \
            --paths "/*"

      - name: Resumen del deploy
        run: |
          CF_DOMAIN=$(terraform -chdir=infra output -raw cloudfront_domain)
          API_URL=${{ steps.tf_outputs.outputs.api_url }}
          BUCKET=${{ steps.tf_outputs.outputs.web_bucket }}
          REGION=${{ env.AWS_REGION }}

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Deploy Prod completado

          ### 🌐 URLs
          | Recurso | URL |
          |---|---|
          | **Frontend** | [$CF_DOMAIN]($CF_DOMAIN) |
          | **API Gateway** | [$API_URL]($API_URL) |

          ### ☁️ Recursos AWS
          | Recurso | Nombre |
          |---|---|
          | S3 bucket | \`$BUCKET\` |
          | CloudFront ID | \`${{ steps.tf_outputs.outputs.cf_distribution_id }}\` |
          | Cognito Pool | \`${{ steps.tf_outputs.outputs.cognito_pool_id }}\` |
          | Región | \`$REGION\` |

          ### 🔗 Consolas AWS
          | Servicio | Link |
          |---|---|
          | CloudFront | [Abrir distribución](https://console.aws.amazon.com/cloudfront/v3#/distributions/${{ steps.tf_outputs.outputs.cf_distribution_id }}) |
          | S3 | [Abrir bucket](https://s3.console.aws.amazon.com/s3/buckets/$BUCKET) |
          | API Gateway | [Abrir API](https://console.aws.amazon.com/apigateway/main/apis?region=$REGION) |
          | Cognito | [Abrir User Pool](https://console.aws.amazon.com/cognito/v2/idp/user-pools?region=$REGION) |
          EOF
