name: Deploy Prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0

jobs:
  # ── PR: plan de infra como comentario ────────────────────────────────────
  plan:
    name: Terraform Plan (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      # ── Backend Tests ────────────────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: lambdas
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: lambdas
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      # ── AWS + Infraestructura ────────────────────────────────────────────

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Generar prod.tfvars
        working-directory: infra
        run: |
          mkdir -p envs
          cat > envs/prod.tfvars << EOF
          environment        = "prod"
          aws_region         = "us-east-1"
          frontend_url       = "https://qrme.vercel.app"
          photos_bucket_name = "qrme-photos"

          cognito_callback_urls = ["https://qrme.vercel.app/auth/callback"]
          cognito_logout_urls   = ["https://qrme.vercel.app"]
          EOF

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backends/prod.hcl -reconfigure

      - name: Terraform Plan
        id: plan
        working-directory: infra
        run: |
          touch plan_output.txt
          terraform plan -var-file=envs/prod.tfvars -no-color 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comentar plan en PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('infra/plan_output.txt')
              ? fs.readFileSync('infra/plan_output.txt', 'utf8')
              : '(sin salida — el step de plan no llegó a ejecutarse)';
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncado)'
              : plan;
            const icon = '${{ steps.plan.outputs.exit_code }}' === '0' ? 'OK' : 'ERROR';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '[' + icon + '] Terraform Plan -- QRME Produccion\n\`\`\`hcl\n' + truncated + '\n\`\`\`'
            });

      - name: Fail si el plan tuvo error
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1

  # ── Push a main: tests + infra ───────────────────────────────────────────
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      # ── Backend Tests ────────────────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: lambdas
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: lambdas
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      # ── AWS + Infraestructura ────────────────────────────────────────────

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Generar prod.tfvars
        working-directory: infra
        run: |
          mkdir -p envs
          cat > envs/prod.tfvars << EOF
          environment        = "prod"
          aws_region         = "us-east-1"
          frontend_url       = "https://qrme.vercel.app"
          photos_bucket_name = "qrme-photos"

          cognito_callback_urls = ["https://qrme.vercel.app/auth/callback"]
          cognito_logout_urls   = ["https://qrme.vercel.app"]
          EOF

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backends/prod.hcl -reconfigure

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=envs/prod.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
