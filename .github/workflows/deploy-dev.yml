name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0
  WEB_BUCKET: qrme-web-dev
  API_URL_DEV: https://pxo1j6kgi7.execute-api.us-east-1.amazonaws.com/dev

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      # ── Backend Tests ──────────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: lambdas
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: lambdas
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      # ── AWS + Infraestructura ──────────────────────────────────────

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Bootstrap backend S3 (idempotente)
        run: |
          aws s3api head-bucket --bucket qrme-tfstate-dev 2>/dev/null || {
            aws s3api create-bucket --bucket qrme-tfstate-dev --region us-east-1
            aws s3api put-bucket-versioning --bucket qrme-tfstate-dev \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket qrme-tfstate-dev \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket qrme-tfstate-dev \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          }
          aws dynamodb describe-table --table-name qrme-tfstate-locks-dev --region us-east-1 2>/dev/null || \
            aws dynamodb create-table \
              --table-name qrme-tfstate-locks-dev \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1

      - name: Bootstrap web bucket (idempotente)
        run: |
          aws s3api head-bucket --bucket ${{ env.WEB_BUCKET }} 2>/dev/null || {
            aws s3api create-bucket --bucket ${{ env.WEB_BUCKET }} --region us-east-1
            aws s3api put-bucket-website --bucket ${{ env.WEB_BUCKET }} \
              --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"404/index.html"}}'
            aws s3api put-public-access-block --bucket ${{ env.WEB_BUCKET }} \
              --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"
            aws s3api put-bucket-policy --bucket ${{ env.WEB_BUCKET }} \
              --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::${{ env.WEB_BUCKET }}/*"}]}'
          }

      - name: Generar dev.tfvars
        working-directory: infra
        run: |
          mkdir -p envs
          WEB_URL="http://${{ env.WEB_BUCKET }}.s3-website-us-east-1.amazonaws.com"
          cat > envs/dev.tfvars << EOF
          environment        = "dev"
          aws_region         = "us-east-1"
          frontend_url       = "$WEB_URL"
          photos_bucket_name = "qrme-photos-dev"

          cognito_callback_urls = ["$WEB_URL/auth/callback/"]
          cognito_logout_urls   = ["$WEB_URL"]
          EOF

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backends/dev.hcl -reconfigure

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=envs/dev.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      # ── Frontend ──────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qrme-frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: qrme-frontend
        run: npm ci

      - name: Obtener outputs de Terraform
        id: tf_outputs
        working-directory: infra
        run: |
          echo "cognito_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(terraform output -raw cognito_domain)" >> $GITHUB_OUTPUT

      - name: Build frontend (dev)
        working-directory: qrme-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL_DEV }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ steps.tf_outputs.outputs.cognito_pool_id }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf_outputs.outputs.cognito_client_id }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.tf_outputs.outputs.cognito_domain }}
        run: npm run build

      - name: Sync a S3
        run: aws s3 sync qrme-frontend/out/ s3://${{ env.WEB_BUCKET }} --delete
